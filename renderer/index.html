<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AutoClicker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>AutoClicker</h1>
    <span class="badge" id="status-badge">停止</span>
  </header>

  <section class="card">
    <h2>方案</h2>
    <div class="row">
      <select id="scheme-select" class="sel"></select>
    </div>
    <div class="row btn-row">
      <button id="scheme-save"   class="btn btn-mini">保存</button>
      <button id="scheme-new"    class="btn btn-mini">新建</button>
      <button id="scheme-rename" class="btn btn-mini">重命名</button>
      <button id="scheme-delete" class="btn btn-mini btn-danger">删除</button>
    </div>
  </section>

  <section class="card">
    <h2>目标显示器</h2>
    <div class="row">
      <select id="display-select" class="sel"></select>
    </div>
  </section>

  <section class="card">
    <h2>点击位置</h2>
    <div class="row">
      <label class="checkbox-label">
        <input type="checkbox" id="use-center" checked>
        使用屏幕正中心（无拾取点时）
      </label>
    </div>
    <ul id="point-list" class="point-list">
      <li class="point-empty">尚未拾取任何点</li>
    </ul>
    <div class="row btn-row">
      <button id="pick-position" class="btn btn-secondary">拾取屏幕位置</button>
      <button id="clear-points"  class="btn btn-mini">清空</button>
    </div>
    <p class="hint">左键添加，右键完成，ESC 取消。多点会按顺序循环点击。</p>
  </section>

  <section class="card">
    <h2>点击间隔</h2>
    <div class="row">
      <input type="number" id="interval" min="100" max="3600000" value="5000" step="100">
      <span class="unit">毫秒</span>
    </div>
    <p class="hint">当前: <strong id="interval-display">5.0 秒</strong> 一次</p>
  </section>

  <section class="card stats">
    <h2>统计</h2>
    <div class="stat-row">
      <span>已点击</span>
      <span id="click-count" class="count">0</span>
      <span>次</span>
    </div>
  </section>

  <div class="actions">
    <button id="toggle-btn" class="btn btn-primary">开始点击</button>
  </div>

  <footer class="hint hotkey-hint">
    <span>快捷键: <kbd>F6</kbd> 开始 / 停止</span>
  </footer>
</div>
<script src="renderer.js"></script>
</body>
</html>
