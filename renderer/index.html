<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AutoClicker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>AutoClicker</h1>
    <span class="badge" id="status-badge">停止</span>
  </header>

  <section class="card">
    <h2>目标显示器</h2>
    <div class="row">
      <select id="display-select" class="sel"></select>
    </div>
  </section>

  <section class="card">
    <h2>点击位置</h2>
    <div class="row">
      <label>X</label>
      <input type="number" id="pos-x" min="0">
      <label>Y</label>
      <input type="number" id="pos-y" min="0">
    </div>
    <div class="row">
      <label class="checkbox-label">
        <input type="checkbox" id="use-center" checked>
        使用屏幕正中心
      </label>
    </div>
    <button id="pick-position" class="btn btn-secondary">拾取屏幕位置</button>
  </section>

  <section class="card">
    <h2>点击间隔</h2>
    <div class="row">
      <input type="number" id="interval" min="100" max="3600000" value="5000" step="100">
      <span class="unit">毫秒</span>
    </div>
    <p class="hint">当前: <strong id="interval-display">5.0 秒</strong> 一次</p>
  </section>

  <section class="card stats">
    <h2>统计</h2>
    <div class="stat-row">
      <span>已点击</span>
      <span id="click-count" class="count">0</span>
      <span>次</span>
    </div>
  </section>

  <div class="actions">
    <button id="toggle-btn" class="btn btn-primary">开始点击</button>
  </div>

  <footer class="hint hotkey-hint">
    <span>快捷键: <kbd>F6</kbd> 开始 / 停止</span>
  </footer>
</div>
<script src="renderer.js"></script>
</body>
</html>
