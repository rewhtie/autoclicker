<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 100vw; height: 100vh; overflow: hidden;
  cursor: crosshair;
  background: rgba(0,0,0,0.3);
  position: relative;
}
.crosshair {
  position: fixed; pointer-events: none;
  z-index: 9999;
  display: none;
}
.crosshair .h {
  position: fixed; height: 1px; background: #e94560;
  left: 0; right: 0; top: 50%; opacity: 0.7;
}
.crosshair .v {
  position: fixed; width: 1px; background: #e94560;
  top: 0; bottom: 0; left: 50%; opacity: 0.7;
}
.crosshair .dot {
  position: fixed; width: 8px; height: 8px;
  background: #e94560; border-radius: 50%;
  top: 50%; left: 50%; transform: translate(-50%,-50%);
}
.coord-label {
  position: fixed; pointer-events: none;
  background: #e94560; color: #fff;
  font: 14px/1.4 monospace; padding: 4px 10px;
  border-radius: 4px; z-index: 9999;
  display: none;
  bottom: 20px; left: 50%; transform: translateX(-50%);
}
.hint-text {
  position: fixed; pointer-events: none;
  color: #fff; font: 13px sans-serif;
  text-align: center; z-index: 9998;
  bottom: 60px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.6); padding: 8px 14px;
  border-radius: 6px;
  line-height: 1.5;
}
.picked {
  position: fixed; pointer-events: none;
  width: 22px; height: 22px;
  border: 2px solid #2ecc71;
  background: rgba(46, 204, 113, 0.25);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  z-index: 9997;
  color: #fff; font: bold 12px/22px sans-serif;
  text-align: center;
  text-shadow: 0 0 3px #000;
}
</style>
</head>
<body>
<div class="crosshair" id="crosshair">
  <div class="h"></div>
  <div class="v"></div>
  <div class="dot"></div>
</div>
<div class="coord-label" id="coord-label">点击选择位置</div>
<div class="hint-text" id="hint">
  <strong>左键</strong> 添加点 &nbsp;·&nbsp;
  <strong>右键</strong> 完成 &nbsp;·&nbsp;
  <strong>ESC</strong> 取消
  <br>
  <span id="count-line">已拾取 0 个点</span>
</div>

<script>
const crosshair  = document.getElementById("crosshair");
const coordLabel = document.getElementById("coord-label");
const countLine  = document.getElementById("count-line");

let displayOrigin = { x: 0, y: 0 };
const picked = []; // [{x,y}] in global DIP

window.electronAPI.onOverlayReady((data) => {
  crosshair.style.display = "block";
  if (data && data.displayBounds) {
    displayOrigin = { x: data.displayBounds.x, y: data.displayBounds.y };
  }
});

function toGlobal(e) {
  // clientX/Y are CSS px relative to overlay window; overlay covers the
  // target display, so global DIP = display.bounds + client offset.
  return {
    x: Math.round(displayOrigin.x + e.clientX),
    y: Math.round(displayOrigin.y + e.clientY),
  };
}

function renderMarker(p, idx) {
  const m = document.createElement("div");
  m.className = "picked";
  m.style.left = (p.x - displayOrigin.x) + "px";
  m.style.top  = (p.y - displayOrigin.y) + "px";
  m.textContent = String(idx + 1);
  document.body.appendChild(m);
}

function refreshCount() {
  countLine.textContent = `已拾取 ${picked.length} 个点`;
}

document.addEventListener("mousemove", (e) => {
  const p = toGlobal(e);
  coordLabel.textContent = `X: ${p.x}  Y: ${p.y}`;
  coordLabel.style.display = "block";
});

// Suppress the native context menu so right-click can mean "finish".
document.addEventListener("contextmenu", (e) => { e.preventDefault(); });

// Use mousedown rather than click so right-button is captured even when the
// browser would otherwise fire a contextmenu instead of a click.
document.addEventListener("mousedown", (e) => {
  if (e.button === 0) {
    // Left-click: add a point.
    e.preventDefault();
    const p = toGlobal(e);
    picked.push(p);
    renderMarker(p, picked.length - 1);
    refreshCount();
  } else if (e.button === 2) {
    // Right-click: finish picking. If the user hasn't picked anything,
    // treat it as cancel (close without changing settings).
    e.preventDefault();
    if (picked.length === 0) {
      window.electronAPI.closeOverlay();
    } else {
      window.electronAPI.pickPositions(picked);
    }
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    window.electronAPI.closeOverlay();
  }
});
</script>
</body>
</html>
